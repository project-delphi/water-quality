project:
  type: website
  execute-dir: project
  pre-render:
    - uv run python scripts/analysis.py
    - uv run python scripts/visuals_data.py
  render:
    - index.qmd
    - posts/four-kinds.qmd
    - explore.qmd
    - clusters.qmd
    - report.qmd
    - slides.qmd
    - dashboard.qmd
    - whitepaper.qmd
    - visuals.qmd
  resources:
    - visuals/boyaca.json
    - visuals/tunja.js
    - visuals/tunja.css

execute:
  freeze: false
  cache: false

website:
  title: "Colombian water safety"
  navbar:
