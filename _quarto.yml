        text: Clusters
      - href: report.qmd
        text: Report
      - href: slides.qmd
        text: Slides
      - href: dashboard.qmd
        text: Dashboard
      - href: visuals.qmd
        text: Visuals · Tunja
      - text: Downloads
        menu:
          - href: report.docx
            text: Report (Word)
          - href: report.pdf
            text: Report (PDF)
          - href: report.epub
            text: Report (ePub)
